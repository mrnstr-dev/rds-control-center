name: Build RDSManager EXE
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile PS1 to EXE via PS2EXE
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile '.\RDSManager.ps1' -OutputFile '.\RDSManager.exe' -IconFile '.\RDSManager.ico' -NoConsole -RequireAdmin -STA -Title 'RDS & FSLogix Control Center' -Company 'IT Administration Tools' -Version '4.2.0.0'
      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDSManager-Portable
          path: .\RDSManager.exe
