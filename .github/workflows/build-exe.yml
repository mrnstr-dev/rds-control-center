name: Build Windows EXE & Linux Binary

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PS1 to Windows EXE via PS2EXE
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile ".\RDSManager.ps1" -OutputFile ".\RDSManager.exe" -IconFile ".\RDSManager.ico" -NoConsole -RequireAdmin -STA -Title "RDS & FSLogix Control Center v4.2" -Company "IT Administration Tools" -Version "4.2.0.0"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDSManager-Windows-x64
          path: .\RDSManager.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Build Dependencies & Compile via PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          pip install --upgrade pip
          pip install -r linux/requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name "RDSManager-Linux-x86_64" linux/rds_manager_linux.py

      - name: Upload Ubuntu Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDSManager-Ubuntu-x86_64
          path: dist/RDSManager-Linux-x86_64

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: RDSManager-Windows-x64

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: RDSManager-Ubuntu-x86_64

      - name: Publish Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RDS & FSLogix Control Center ${{ github.ref_name }} (Windows & Ubuntu Linux)
          files: |
            RDSManager.exe
            RDSManager-Linux-x86_64
          generate_release_notes: true
